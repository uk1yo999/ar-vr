<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Classroom WebAR</title>
    <!-- Reliable A-Frame & AR.js CDN links -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <!-- User Interaction Prompt to Allow Audio -->
    <div id="user-gesture" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: white; display: flex; justify-content: center; align-items: center; z-index: 9999; font-family: sans-serif;">
      <h2>Tap Screen to Start AR</h2>
    </div>

    <a-scene 
      embedded 
      vr-mode-ui="enabled: false;" 
      xr-mode-ui="enabled: false;"
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-assets>
        <audio id="my-sound" src="mysound.mp3" preload="auto"></audio>
      </a-assets>

      <a-marker preset="hiro" id="marker">
        <!-- Visible Red Cube to Test Tracking -->
        <a-box position="0 0.5 0" color="red" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        
        <!-- Custom 3D Model (Uncomment below once box works) -->
        <!-- <a-gltf-model src="dinosaur.glb" position="0 0 0" scale="0.1 0.1 0.1"></a-gltf-model> -->

        <a-entity sound="src: #my-sound; autoplay: false"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Unlock Audio on Tap
      const gestureOverlay = document.querySelector('#user-gesture');
      gestureOverlay.addEventListener('click', () => {
        gestureOverlay.style.display = 'none';
      });

      window.addEventListener('load', () => {
        const marker = document.querySelector('#marker');
        const sound = document.querySelector('a-entity[sound]');

        marker.addEventListener('markerFound', () => {
          if (sound && sound.components.sound) {
            sound.components.sound.playSound();
          }
        });

        marker.addEventListener('markerLost', () => {
          if (sound && sound.components.sound) {
            sound.components.sound.pauseSound();
          }
        });
      });
    </script>
  </body>
</html>
